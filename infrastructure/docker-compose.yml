version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: odara-db
    environment:
      POSTGRES_USER: odara
      POSTGRES_PASSWORD: odara_dev_password
      POSTGRES_DB: odara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odara"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odara-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: odara-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odara-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: odara-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: odara
      RABBITMQ_DEFAULT_PASS: odara_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - odara-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: odara-minio
    environment:
      MINIO_ROOT_USER: odara
      MINIO_ROOT_PASSWORD: odara_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - odara-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: odara-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3;timeout 1 cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - odara-network

  # Seq (Logging)
  seq:
    image: datalust/seq:latest
    container_name: odara-seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - odara-network

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: odara-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - odara-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  keycloak_data:
  seq_data:

networks:
  odara-network:
    driver: bridge
